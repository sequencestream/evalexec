name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gorelease compares against the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build
        run: make build

      - name: Version is stamped
        run: ./bin/evalexec --version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

      - name: Guards
        run: make lint-terms lint-boundary check-deps

      - name: Secret leak scan
        run: make lint-secrets

      # Acceptance criterion 21: the protocol has to be checkable without Go.
      # The self-test runs first, because a checker that cannot fail proves
      # nothing about the fixtures it just accepted.
      - name: Protocol verifier self-test
        run: python3 contract/verify_fixtures.py --self-test

      - name: Verify fixtures without Go
        run: python3 contract/verify_fixtures.py fixtures/data

      # A separate module on purpose: only a cross-module build proves that
      # everything a downstream program needs is actually exported.
      - name: Downstream consumer
        working-directory: examples/consumer
        run: go run .

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

      - name: Release configuration is valid
        uses: goreleaser/goreleaser-action@v6
        with:
          args: check

      # Advisory during v0 (dev-plan §1.3); becomes a hard failure at v1.0.
      - name: API compatibility report
        continue-on-error: true
        run: make apidiff
