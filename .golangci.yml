version: "2"

run:
  timeout: 5m
  # Keep the e2e-tagged files in scope so they are linted like everything else.
  build-tags:
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gocritic
    - goconst
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true

    # The library-path boundary, checked on the AST rather than by grepping.
    # evalexec ships as a library as well as a binary, so anything outside
    # cmd/ that exits the process, grabs signals, or writes to os.Stderr would
    # respectively kill, hijack and pollute a host process that embedded it.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.Exit$'
          msg: only cmd/evalexec may exit the process; library code returns an error
        - pattern: '^signal\.Notify$'
          msg: only cmd/evalexec may install signal handlers; library code takes a context
        - pattern: '^os\.Stderr$'
          msg: library code must write diagnostics to an injected io.Writer, not os.Stderr
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    goconst:
      min-occurrences: 4

  exclusions:
    rules:
      # Test helpers legitimately repeat literals and skip error checks on
      # cleanup paths.
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - noctx
      # The binary is where exiting, signal handling and stderr belong.
      - path: ^cmd/
        linters:
          - forbidigo
      # Tests drive a real subprocess to exercise interrupt handling.
      - path: _test\.go
        linters:
          - forbidigo
      # io.EOF is how a streaming reader reports "no more input", not a fault,
      # so the dispatcher returning nil on it is correct rather than a swallowed
      # error. nilerr cannot tell the two apart.
      - path: runner/runner\.go
        linters:
          - nilerr
      # A JSON Schema literal repeats "type" and "string" because those are
      # the schema's own keywords. Hoisting them into constants would make the
      # schema harder to read against the specification it mirrors.
      - path: grader/builtin/llm_judge\.go
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sequencestream/evalexec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
